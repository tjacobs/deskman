<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Deskman — Daily Entries</title>
  <meta name="description" content="Video entries recorded each day by Deskman, the desktop AI robot." />
  <link rel="icon" href="../favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../style.css" />
  <style>
    /* Page column under the nav */
    .entries { max-width: 820px; margin: 0 auto; padding: clamp(2rem, 6vw, 3.5rem) 1.5rem 4rem; }
    .entries h1 { font-size: clamp(2rem, 5vw, 2.8rem); font-weight: 800; margin-bottom: 0.6rem; }
    .entries__sub { color: var(--ink-soft); margin: 0 0 2.4rem; font-size: 1.08rem; }

    /* One card per recording, the day as its heading */
    .entry { background: #fff; border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); padding: 1.2rem; margin-bottom: 1.8rem; }
    .entry__head { display: flex; align-items: baseline; justify-content: space-between; gap: 1rem; flex-wrap: wrap; margin: 0.2rem 0.3rem 0.9rem; }
    .entry__day { font-size: 1.5rem; font-weight: 800; }
    .entry__meta { font-family: var(--mono); font-size: 0.85rem; color: var(--ink-soft); }
    .entry video { display: block; width: 100%; border-radius: 14px; background: var(--eye); }

    /* Loading, empty, and error notes */
    .entries__note { text-align: center; color: var(--ink-soft); padding: 3rem 1rem; border: 2px dashed var(--line); border-radius: var(--radius); }
  </style>
</head>
<body>
  <header class="nav">
    <div class="nav__inner">
      <a class="brand" href="../">
        <span class="brand__face" aria-hidden="true"><span class="eye"></span><span class="eye"></span></span>
        Deskman
      </a>
      <nav class="nav__links">
        <a href="../">Home</a>
        <a href="./">Recordings</a>
      </nav>
    </div>
  </header>

  <main class="entries">
    <p class="eyebrow">Recorded on the robot</p>
    <h1>Daily entries</h1>
    <p class="entries__sub">A video each day, recorded by tapping Record today's entry on Deskman's screen, newest first.</p>
    <div id="list"><p class="entries__note">Loading entries...</p></div>
  </main>

  <script>
    // Where the robot's sync script writes the list of uploaded videos
    const INDEX_URL = "https://br-restless-queen-b5ezrnhw.storage.c-7.us-east-2.aws.neon.tech/recordings/index.json";
    const BYTES_PER_MEGABYTE = 1024 * 1024;

    // Load the list and draw a card for each video
    async function main() {
      const list = document.getElementById("list");
      try {
        const response = await fetch(INDEX_URL, { cache: "no-cache" });
        if (!response.ok)
          throw new Error("index returned " + response.status);
        const index = await response.json();
        showVideos(list, index.videos || []);
      } catch (error) {
        list.innerHTML = '<p class="entries__note">Could not load entries, ' + error.message + '.</p>';
      }
    }

    // Replace the loading note with the cards, or say there are none yet
    function showVideos(list, videos) {
      list.innerHTML = "";
      if (videos.length === 0) {
        list.innerHTML = '<p class="entries__note">No entries yet.</p>';
        return;
      }
      for (const video of videos)
        list.appendChild(makeCard(video));
    }

    // Build one card, the day and time from the file name and the player under them
    function makeCard(video) {
      const recorded = recordedAt(video.key);
      const card = document.createElement("article");
      card.className = "entry";

      // Day as the heading, time and size beside it
      const head = document.createElement("div");
      head.className = "entry__head";
      const day = document.createElement("h2");
      day.className = "entry__day";
      day.textContent = recorded ? recorded.toLocaleDateString(undefined, { weekday: "long", month: "long", day: "numeric", year: "numeric" }) : video.key;
      const meta = document.createElement("span");
      meta.className = "entry__meta";
      const time = recorded ? recorded.toLocaleTimeString(undefined, { hour: "numeric", minute: "2-digit" }) + "  ·  " : "";
      meta.textContent = time + (video.bytes / BYTES_PER_MEGABYTE).toFixed(1) + " MB";
      head.append(day, meta);

      // Player that only loads the video's length until play is pressed
      const player = document.createElement("video");
      player.src = video.url;
      player.controls = true;
      player.preload = "metadata";
      player.playsInline = true;
      card.append(head, player);
      return card;
    }

    // Read the robot's local start time out of a name like video_2026_10_04_13_12_07.mp4
    function recordedAt(key) {
      const match = key.match(/video_(\d{4})_(\d{2})_(\d{2})_(\d{2})_(\d{2})_(\d{2})/);
      if (!match)
        return null;
      const [, year, month, day, hour, minute, second] = match.map(Number);
      return new Date(year, month - 1, day, hour, minute, second);
    }

    // Run
    main();
  </script>
</body>
</html>
